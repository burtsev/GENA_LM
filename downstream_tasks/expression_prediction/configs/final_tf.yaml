TASK_NAME: expression/final_tf-4cls-adapter-borzoi-all_genes

HOME_PATH: ${oc.env:GENALM_HOME}

MODEL_PATH_ROOT: ${HOME_PATH}/runs/${TASK_NAME}


args_params:

  _target_: builtins.dict
  init_checkpoint: "${oc.env:PERT_DATA_ROOT}/models/all_datasets_2/pytorch_model.bin"
  resume:

  model_cfg: "./data/configs/L12-H768-A12-V32k-preln.json"

  model_cls: "downstream_tasks.expression_prediction.expression_model_final_tf:ExpressionCounts"

  model_path: ${MODEL_PATH_ROOT}

  clip_grad_norm: 1

  input_seq_len: 1024

  optimizer: "AdamW"

  weight_decay: 1e-4

  seed: 45

  num_warmup_steps: 1000

  log_interval: 50

  # A complete 35,086-item validation pass takes about 24 minutes on one H100.
  valid_interval: 10000

  save_best: True

  save_interval: 10000

  optimize_metric: "pearson_corr_cells_all_borzoi_human"

  optimize_mode: "max"

  data_n_workers: 7

  lr: 1e-4

  lr_scheduler: "constant_with_warmup"

  reset_lr: True

  reset_optimizer: True

  reset_iteration: True

  early_stopping_patience: 500000

  iters: 350000

  gen_tokenizer: "${oc.env:PERT_DATA_ROOT}/models/modernbert_large"

  # The four-CLS checkpoint bundle copies the legacy-compatible 57-token tokenizer.
  tf_tokenizer: "${oc.env:PERT_DATA_ROOT}/models/moderngena-tf-4cls"

selected_targets_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/datasets/data/ct_specific_benchmark/selected_targets.csv"

model_kwargs:
  _target_: builtins.dict
  hf: True
  hf_model_name: "${oc.env:PERT_DATA_ROOT}/models/modernbert_large"
  hf_model_name_decoder: "${oc.env:PERT_DATA_ROOT}/models/decoder" #dp0.1"
  # The legacy 1,024-wide checkpoint is incompatible. Null means deliberate scratch init.
  # Replace with a matching four-CLS checkpoint directory after expression pretraining.
  tf_model_path: null
  tf_config_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/configs/expression_profile_encoder_4cls"
  # Mixed precision remains BF16; this separately records the stored parameter dtype.
  tf_parameter_dtype: "float32"
  # Freeze the DNA encoder, decoder, LayerNorms, and prediction head.
  expression_encoder_only: true
  # DNA encoder freezing:
  #   null  - the whole encoder is trainable
  #   0     - every layer frozen
  #   k     - only the last k layers (+ final norm) are trainable
  bert_trainable_layers: 0
  # train the token embeddings of the DNA encoder (ignored when bert_trainable_layers is null)
  bert_train_embeddings: false

  loss_fct:
    _target_: torch.nn.MSELoss
    reduction: 'none'

  activation:
    _target_: torch.nn.Identity

  config:
    _target_: builtins.dict

  weight: 8

# shared dataset parameters
shared_dataset_params:
  n_keys: 14
  gen_tokenizer: ${args_params.gen_tokenizer}
  gen_max_seq_len: ${args_params.input_seq_len}
  tf_tokenizer: ${args_params.tf_tokenizer}
  # Canonical checkpoint-side encoding artifacts; all splits must use these exact files.
  panel_genes_path: "${oc.env:PERT_DATA_ROOT}/models/moderngena-tf-4cls/panel_genes.txt"
  bin_edges_path: "${oc.env:PERT_DATA_ROOT}/models/moderngena-tf-4cls/bin_edges.npy"
  encoding_metadata_path: "${oc.env:PERT_DATA_ROOT}/models/moderngena-tf-4cls/expression_encoding.json"
  # one gene id per line: these genes are always [UNK] in the tf panel and are never targets
  # The historical marker_genes.txt is absent from this checkout. Keep the
  # forced-unknown list explicitly empty; absent/non-finite profile values still use [UNK].
  unk_genes_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/tf_unk_genes.txt"
  loglevel:
    "_target_": "logging.getLevelName"
    "level": "DEBUG"
  seed: "${args_params.seed}"

# the tf panel holds every gene of the profiles; [UNK]-list genes are dropped from targets in code
train_dataset_human:
  _target_: downstream_tasks.expression_prediction.expression_dataset_final_tf.ExpressionDataset
  forward_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.forward.csv"
  reverse_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.reverse.csv"
  targets_path: "${oc.env:PERT_DATA_ROOT}/data/pert/train_file_mappings_tpm_borzoi_v1_qref.csv"
  genome: "${oc.env:PERT_GENOME}"
  tpm: csv
  num_before: 512
  transform_targets_tpm:
    _target_: downstream_tasks.expression_prediction.expression_dataset_final_tf.logtransform
    pseudocount: 1

#valid
valid_dataset_human:
  _target_: downstream_tasks.expression_prediction.expression_dataset_final_tf.ExpressionDataset
  forward_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.forward.csv"
  reverse_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.reverse.csv"
  targets_path: "${oc.env:PERT_DATA_ROOT}/data/pert/valid_file_mappings_tpm_borzoi_v1_qref.csv"
  genome: "${oc.env:PERT_GENOME}"
  tpm: csv
  num_before: 512
  transform_targets_tpm:
    _target_: downstream_tasks.expression_prediction.expression_dataset_final_tf.logtransform
    pseudocount: 1

# The existing archive has no independent test mapping. Validation remains separate;
# do not silently reuse it as test data.
